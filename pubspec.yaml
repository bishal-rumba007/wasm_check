name: wasm_check
description: Pre-flight WASM compatibility audit for Dart and Flutter projects. Checks your dependency tree before you build.
version: 0.1.0
repository: https://github.com/YOUR_USERNAME/wasm_check

environment:
  sdk: '>=3.3.0 <4.0.0'

executables:
  wasm_check: wasm_check            # maps `wasm_check` CLI command → bin/wasm_check.dart

dependencies:
  args: ^2.5.0
  http: ^1.2.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.2