name: wasm_check
description: Pre-flight WASM compatibility audit for Dart and Flutter projects. Checks your dependency tree before you build.
version: 0.1.0
repository: https://github.com/bishal-rumba007/wasm_check
issue_tracker: https://github.com/bishal-rumba007/wasm_check/issues

environment:
  sdk: '>=3.3.0 <4.0.0'

executables:
  wasm_check: wasm_check            # maps `wasm_check` CLI command → bin/wasm_check.dart

dependencies:
  args: ^2.7.0
  http: ^1.6.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0

topics:
  - wasm
  - flutter
  - dart
  - cli
  - webassembly